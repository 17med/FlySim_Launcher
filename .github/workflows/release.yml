name: Launcher release

# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) runs the tests, builds the
# launcher on Linux and Windows (Tauri cannot cross-compile Windows from Linux), and publishes
# the installers as a GitHub Release for that tag. Uses only the built-in GITHUB_TOKEN.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.99.1

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && rustup default "$RUST_TOOLCHAIN"
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  # Starts as a draft so both builds attach to one release, and a failed build leaves a draft
  # rather than a public release missing a platform. Same pattern as the game repository.
  draft:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Launcher $GITHUB_REF_NAME" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        # 22.04 rather than latest: the Linux build only runs on systems with this glibc or newer.
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - run: npm ci
      # The signing key makes the build write a .sig next to each installer, and tauri-action then
      # publishes latest.json, which installed launchers poll to update themselves. The public half
      # is in tauri.conf.json > plugins > updater; losing the private key stops all self-updates.
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
